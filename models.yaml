default: local #openrouter

models:
  openrouter:
    backend: openrouter
    model: qwen/qwen3.7-flash
    api_url: https://openrouter.ai/api/v1/chat/completions
    timeout: 60
    # The model holds 1M tokens; this only stops a long session growing forever.
    context_budget: 100000

  # Needs the trtllm110 conda environment; the engine is FP16, batch 1,
  # 2048-token context, built for this machine's SM 8.6 GPU.
  local:
    backend: trtllm
    engine_dir: ~/Projects/agents/trtllm-work/engines/Llama-3.2-1B-Instruct-fp16-a2000
    tokenizer_dir: ~/Projects/agents/trtllm-work/hf/Llama-3.2-1B-Instruct
    max_new_tokens: 256
    max_seq_len: 2048
    temperature: 0.7
    top_p: 0.9
    kv_cache_fraction: 0.80
